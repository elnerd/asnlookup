name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

    - name: Coverage summary
      run: go tool cover -func=coverage.out

    - name: Upload coverage profile
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out

    - name: Fuzz smoke test
      run: |
        for target in FuzzRangeToPrefixes FuzzTrailingZeroBits FuzzLoadFromCache; do
          echo "::group::$target"
          go test ./pkg/asnlookup -run='^$' -fuzz="^${target}$" -fuzztime=30s
          echo "::endgroup::"
        done
